name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew :app:assembleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" "memo-${GITHUB_REF#refs/tags/}.apk"
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${{ github.ref_name }}" \
            --notes "Build from ${{ github.sha }}." \
            --generate-notes \
            "memo-${GITHUB_REF#refs/tags/}.apk"
